<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Uranus">
  <defs>
    <clipPath id="front">
      <!-- moitié avant de l'anneau (côté droit après rotation) -->
      <rect x="32" y="-10" width="40" height="84" transform="rotate(14 32 32)"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0f1a3c"/>
  <circle cx="11" cy="13" r="1.3" fill="#c9d3ee"/>
  <circle cx="53" cy="50" r="1.1" fill="#c9d3ee"/>
  <circle cx="14" cy="51" r="0.9" fill="#c9d3ee"/>
  <!-- anneau, partie arrière -->
  <ellipse cx="32" cy="32" rx="7.5" ry="26" transform="rotate(14 32 32)" fill="none" stroke="#ff8b5e" stroke-width="3.2" opacity="0.55"/>
  <!-- planète -->
  <circle cx="32" cy="32" r="17" fill="#7de3e1"/>
  <path d="M32 15a17 17 0 0 1 0 34a21 21 0 0 0 0-34z" fill="#4fc4c2"/>
  <!-- anneau, partie avant -->
  <ellipse cx="32" cy="32" rx="7.5" ry="26" transform="rotate(14 32 32)" fill="none" stroke="#ff8b5e" stroke-width="3.2" clip-path="url(#front)"/>
  <!-- lune -->
  <circle cx="51" cy="14" r="3.2" fill="#ffffff"/>
</svg>
